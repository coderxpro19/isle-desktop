[package]
name = "isle"
version = "0.1.0"
description = "Isle — a Dynamic Island and dock for Windows"
authors = ["coderxpro19"]
edition = "2021"
rust-version = "1.80"
license = "MIT"

[lib]
name = "isle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
parking_lot = "0.12"
base64 = "0.22"
rustfft = "6"
# Audio capture for the visualiser. On Windows (WASAPI) an *input* stream on the
# default *output* device is a loopback capture of whatever is playing.
cpal = "0.16"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_System_Power",
  "Win32_System_WinRT",
] }

[features]
# Passed by `tauri build` / `tauri dev`; do not remove.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind" # we rely on panic hooks to restore shell state (Phase 3)
strip = true
