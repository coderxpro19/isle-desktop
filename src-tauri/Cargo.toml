[package]
name = "isle"
version = "0.8.0"
description = "Isle — a Dynamic Island and dock for Windows"
authors = ["coderxpro19"]
edition = "2021"
rust-version = "1.85"
license = "MIT"

[lib]
name = "isle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
parking_lot = "0.12"
base64 = "0.22"
rustfft = "6"
# Audio capture for the visualiser. On Windows (WASAPI) an *input* stream on the
# default *output* device is a loopback capture of whatever is playing.
cpal = "0.16"
png = "0.17"
sysinfo = { version = "0.40", default-features = false, features = ["system", "disk", "network"] }

[target.'cfg(windows)'.dependencies]
# Needed by the `#[implement]` macro for COM callbacks.
windows-core = "0.62"
windows-collections = "0.3"
windows = { version = "0.62", features = [
  "Devices_Bluetooth",
  "Devices_Enumeration",
  "Devices_Geolocation",
  "Devices_Radios",
  "Devices_WiFi",
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Networking_Connectivity",
  "Security_Credentials",
  "ApplicationModel",
  "Storage_Streams",
  "UI_Notifications",
  "UI_Notifications_Management",
  "Web_Http",
  "Win32_Devices_Display",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Media_KernelStreaming",
  "Win32_NetworkManagement_WiFi",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Performance",
  "Win32_System_Power",
  "Win32_System_Rpc",
  "Win32_System_Shutdown",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_Wmi",
  "Win32_System_WinRT",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }

[features]
# Passed by `tauri build` / `tauri dev`; do not remove.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind" # we rely on panic hooks to restore shell state (Phase 3)
strip = true
