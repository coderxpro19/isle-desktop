name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    name: Build & test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS dependencies
        run: npm ci

      - name: Typecheck + unit tests (UI)
        run: |
          npm run typecheck
          npm test

      - name: Build UI
        run: npx vite build

      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests (Rust)
        working-directory: src-tauri
        run: cargo test

      - name: Bundle installer
        run: npm run app:build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: isle-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      # Each new version (from tauri.conf.json) pushed to main becomes a GitHub
      # Release with the installers attached. Bump the version to release.
      - name: Publish GitHub release for new versions
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION already released"; exit 0
          fi
          gh release create "v$VERSION" \
            src-tauri/target/release/bundle/nsis/*.exe \
            src-tauri/target/release/bundle/msi/*.msi \
            --target "$GITHUB_SHA" --title "Isle v$VERSION" --generate-notes --latest
