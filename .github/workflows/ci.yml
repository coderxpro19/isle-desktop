name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    name: Build & test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS dependencies
        run: npm ci

      - name: Typecheck + unit tests (UI)
        run: |
          npm run typecheck
          npm test

      - name: Build UI
        run: npx vite build

      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests (Rust)
        working-directory: src-tauri
        run: cargo test

      # With TAURI_SIGNING_PRIVATE_KEY set, the build also signs the installer
      # for the in-app updater (a .sig next to the .exe).
      - name: Bundle installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npm run app:build -- --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY not set; building without in-app update support"
            npm run app:build
          fi

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: isle-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      # Each new version (from tauri.conf.json) pushed to main becomes a GitHub
      # Release with the installers attached. Bump the version to release.
      - name: Publish GitHub release for new versions
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION already released"; exit 0
          fi
          FILES=(src-tauri/target/release/bundle/nsis/*.exe src-tauri/target/release/bundle/msi/*.msi)
          # Update feed for the in-app updater: points at the signed NSIS installer.
          SIG=$(ls src-tauri/target/release/bundle/nsis/*.exe.sig 2>/dev/null | head -1)
          if [ -n "$SIG" ]; then
            EXE=$(basename "${SIG%.sig}")
            node -e '
              const fs = require("fs");
              const [version, sig, exe, repo] = process.argv.slice(1);
              fs.writeFileSync("latest.json", JSON.stringify({
                version,
                notes: `See https://github.com/${repo}/releases/tag/v${version}`,
                pub_date: new Date().toISOString(),
                platforms: { "windows-x86_64": {
                  signature: fs.readFileSync(sig, "utf8").trim(),
                  url: `https://github.com/${repo}/releases/download/v${version}/${exe}`,
                } },
              }, null, 2));
            ' "$VERSION" "$SIG" "$EXE" "$GITHUB_REPOSITORY"
            FILES+=(latest.json)
          fi
          gh release create "v$VERSION" "${FILES[@]}" \
            --target "$GITHUB_SHA" --title "Isle v$VERSION" --generate-notes --latest
